<script>
  const MON_MDP = "Ousman2026!"; // CHANGE CE MOT DE PASSE
  
  function checkMdp() {
    if(document.getElementById('mdp').value == MON_MDP) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadSolde();
    } else { alert('❌ Mot de passe incorrect'); }
  }
  
  function deconnexion() {
    document.getElementById('login').style.display = 'block';
    document.getElementById('app').style.display = 'none';
    document.getElementById('mdp').value = '';
  }
  
  let solde = parseInt(localStorage.getItem('soldeKoreOusman')) || 0;
  function loadSolde() { document.getElementById('solde').innerText = solde.toLocaleString() + 'f'; }
  
  function addMoney(num) {
    solde += 3200;
    localStorage.setItem('soldeKoreOusman', solde);
    loadSolde();
    alert('✅ Vidéo ' + num + ' validée ! +3 200f ajouté\nNouveau solde: ' + solde.toLocaleString() + 'f');
  }
</script>
