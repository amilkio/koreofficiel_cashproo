<script>
let solde = parseInt(localStorage.getItem('solde')) || 0;
document.getElementById('solde').innerText = solde;

function login(){
  if(document.getElementById('pwd').value === 'Ousman2026!'){
    document.getElementById('login').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  } else { alert('Mot de passe incorrect'); }
}

function addMoney(montant){
  solde += montant;
  localStorage.setItem('solde', solde);
  document.getElementById('solde').innerText = solde;
  alert('+' + montant + 'F ajouté !');
}
